name: 功能建议
description: 提出一个能力或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不顺手？尽量给使用场景，而不是先给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / 明确不想要的
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 大致范围
      options:
        - 界面 / 交互（设置页、pill、详情页）
        - 统计口径 / 价格匹配
        - 多语言 / 文档
        - 宿主集成（槽位、通道、兼容性）
        - 不确定
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH / Harness 版本（可选）
      placeholder: DSH NEXT 2.0.22 / 内核 0.2.2-rc.1
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，没有重复
          required: true
